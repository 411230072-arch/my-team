<!-- 交接 / Handoff: 完成符合衛福部標準之繁體中文單檔 BMI 計算器，含即時防呆驗證與響應式介面；注意 170cm/75kg 標準四捨五入為 26.0（皆屬過重區間）；已手動實測各邊界值，可直接使用。 -->
<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BMI 計算器</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger: #ef4444;
      --danger-bg: #fef2f2;
      --danger-border: #fecaca;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", "微軟正黑體", sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.08), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      border: 1px solid var(--border-color);
      width: 100%;
      max-width: 480px;
      padding: 32px 28px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: #0f172a;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 6px;
      color: #334155;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      color: var(--text-main);
      background-color: #fff;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input[type="text"]:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
    }

    button:active {
      transform: scale(0.98);
    }

    .btn-calc {
      background-color: var(--primary);
      color: #ffffff;
    }

    .btn-calc:hover {
      background-color: var(--primary-hover);
    }

    .btn-clear {
      background-color: #f1f5f9;
      color: #475569;
      border: 1px solid var(--border-color);
    }

    .btn-clear:hover {
      background-color: #e2e8f0;
    }

    .error-alert {
      display: none;
      margin-top: 18px;
      padding: 12px 16px;
      background-color: var(--danger-bg);
      border: 1px solid var(--danger-border);
      border-radius: 8px;
      color: var(--danger);
      font-size: 0.92rem;
      font-weight: 500;
      text-align: center;
    }

    .result-card {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border-radius: 12px;
      background-color: #f8fafc;
      border: 1px solid var(--border-color);
      text-align: center;
    }

    .result-title {
      font-size: 0.95rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    .result-value {
      font-size: 2.4rem;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.2;
    }

    .badge {
      display: inline-block;
      margin-top: 10px;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 700;
      color: #ffffff;
    }

    .cat-underweight { background-color: #3b82f6; }
    .cat-normal      { background-color: #10b981; }
    .cat-overweight  { background-color: #f59e0b; }
    .cat-obese1      { background-color: #f97316; }
    .cat-obese2      { background-color: #ef4444; }
    .cat-obese3      { background-color: #b91c1c; }

    .table-section {
      margin-top: 28px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    .table-title {
      font-size: 0.88rem;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 10px;
      text-align: center;
    }

    .category-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }

    .category-table th, .category-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
    }

    .category-table th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
    }

    .category-table td:last-child {
      font-weight: 600;
    }

    .category-table tr.active-row {
      background-color: #eff6ff;
      font-weight: bold;
    }

    .category-table tr.active-row td {
      color: var(--primary);
    }

    @media (max-width: 480px) {
      .container {
        padding: 24px 18px;
      }
      h1 {
        font-size: 1.4rem;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>BMI 計算器</h1>
    <p class="subtitle">公式：體重(kg) ÷ 身高(m)²</p>

    <div class="form-group">
      <label for="height">身高（公分）</label>
      <input type="text" id="height" inputmode="decimal" placeholder="例如：170" autocomplete="off">
    </div>

    <div class="form-group">
      <label for="weight">體重（公斤）</label>
      <input type="text" id="weight" inputmode="decimal" placeholder="例如：65" autocomplete="off">
    </div>

    <div class="btn-group">
      <button type="button" class="btn-calc" id="btn-calc">計算</button>
      <button type="button" class="btn-clear" id="btn-clear">清除</button>
    </div>

    <div class="error-alert" id="error-box"></div>

    <div class="result-card" id="result-box">
      <div class="result-title">您的 BMI 是</div>
      <div class="result-value" id="bmi-value">--</div>
      <div>
        <span class="badge" id="bmi-category">--</span>
      </div>
    </div>

    <div class="table-section">
      <div class="table-title">衛福部 BMI 標準對照表</div>
      <table class="category-table">
        <thead>
          <tr>
            <th>BMI 範圍</th>
            <th>顯示文字</th>
          </tr>
        </thead>
        <tbody>
          <tr id="row-underweight">
            <td>&lt; 18.5</td>
            <td>過輕</td>
          </tr>
          <tr id="row-normal">
            <td>18.5 ≤ BMI &lt; 24</td>
            <td>正常</td>
          </tr>
          <tr id="row-overweight">
            <td>24 ≤ BMI &lt; 27</td>
            <td>過重</td>
          </tr>
          <tr id="row-obese1">
            <td>27 ≤ BMI &lt; 30</td>
            <td>輕度肥胖</td>
          </tr>
          <tr id="row-obese2">
            <td>30 ≤ BMI &lt; 35</td>
            <td>中度肥胖</td>
          </tr>
          <tr id="row-obese3">
            <td>≥ 35</td>
            <td>重度肥胖</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    const heightInput = document.getElementById('height');
    const weightInput = document.getElementById('weight');
    const calcBtn = document.getElementById('btn-calc');
    const clearBtn = document.getElementById('btn-clear');
    const errorBox = document.getElementById('error-box');
    const resultBox = document.getElementById('result-box');
    const bmiValueElem = document.getElementById('bmi-value');
    const bmiCatElem = document.getElementById('bmi-category');

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = 'block';
      resultBox.style.display = 'none';
      clearTableHighlights();
    }

    function clearTableHighlights() {
      const rows = document.querySelectorAll('.category-table tbody tr');
      rows.forEach(function(row) {
        row.classList.remove('active-row');
      });
    }

    function calculateBMI() {
      const heightRaw = heightInput.value.trim();
      const weightRaw = weightInput.value.trim();

      // 檢查空白或非數字
      if (heightRaw === '' || weightRaw === '') {
        showError('請輸入數字');
        return;
      }

      const height = Number(heightRaw);
      const weight = Number(weightRaw);

      if (isNaN(height) || isNaN(weight)) {
        showError('請輸入數字');
        return;
      }

      // 檢查數值是否大於 0
      if (height <= 0 || weight <= 0) {
        showError('數值必須大於 0');
        return;
      }

      // 檢查合理數值範圍 (身高 50–250 cm, 體重 10–300 kg)
      if (height < 50 || height > 250 || weight < 10 || weight > 300) {
        showError('請輸入合理的身高體重數值');
        return;
      }

      // 計算 BMI
      const heightM = height / 100;
      const exactBmi = weight / (heightM * heightM);
      const bmiFormatted = exactBmi.toFixed(1);
      const bmiVal = parseFloat(bmiFormatted);

      // 判定衛福部標準等級
      let category = '';
      let categoryClass = '';
      let rowId = '';

      if (bmiVal < 18.5) {
        category = '過輕';
        categoryClass = 'cat-underweight';
        rowId = 'row-underweight';
      } else if (bmiVal < 24.0) {
        category = '正常';
        categoryClass = 'cat-normal';
        rowId = 'row-normal';
      } else if (bmiVal < 27.0) {
        category = '過重';
        categoryClass = 'cat-overweight';
        rowId = 'row-overweight';
      } else if (bmiVal < 30.0) {
        category = '輕度肥胖';
        categoryClass = 'cat-obese1';
        rowId = 'row-obese1';
      } else if (bmiVal < 35.0) {
        category = '中度肥胖';
        categoryClass = 'cat-obese2';
        rowId = 'row-obese2';
      } else {
        category = '重度肥胖';
        categoryClass = 'cat-obese3';
        rowId = 'row-obese3';
      }

      // 顯示結果
      errorBox.style.display = 'none';
      bmiValueElem.textContent = bmiFormatted;
      bmiCatElem.textContent = category;
      bmiCatElem.className = 'badge ' + categoryClass;
      resultBox.style.display = 'block';

      // 標註對照表該行
      clearTableHighlights();
      const activeRow = document.getElementById(rowId);
      if (activeRow) {
        activeRow.classList.add('active-row');
      }
    }

    function clearAll() {
      heightInput.value = '';
      weightInput.value = '';
      errorBox.style.display = 'none';
      resultBox.style.display = 'none';
      clearTableHighlights();
      heightInput.focus();
    }

    calcBtn.addEventListener('click', calculateBMI);
    clearBtn.addEventListener('click', clearAll);

    // 支援 Enter 鍵直接計算
    heightInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calculateBMI();
    });
    weightInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') calculateBMI();
    });
  </script>
</body>
</html>
